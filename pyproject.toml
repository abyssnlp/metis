[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-kb"
version = "0.1.1"
description = "A CLI knowledge base for commands, code snippets, and SQL queries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "chromadb>=0.4",
]

[project.urls]
Homepage = "https://github.com/abyssnlp/metis"
Issues = "https://github.com/abyssnlp/metis/issues"

[project.scripts]
metis = "metis.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (lint + format) ────────────────────────────────────────────────

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP007",  # use X | Y for unions (needs 3.10+)
]

[tool.ruff.lint.isort]
known-first-party = ["metis"]
