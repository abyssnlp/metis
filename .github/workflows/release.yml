name: Release

on:
  push:
    tags:
      - "v*"

# OIDC token is used for PyPI trusted publisher (no API token secrets needed).
# Configure a trusted publisher on PyPI:
#   Publisher: GitHub Actions
#   Owner: abyssnlp  |  Repository: metis  |  Workflow: release.yml
permissions:
  contents: write   # create GitHub releases and push formula update
  id-token: write   # PyPI OIDC trusted publisher

jobs:
  # ── 1. Build wheel + sdist ───────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 2. Publish to PyPI (OIDC — no token secrets) ────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/metis-kb
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 3. Create GitHub Release with dist assets ────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "metis ${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  # ── 4. Update Homebrew formula in-repo (abyssnlp/metis acts as the tap) ───
  update-homebrew:
    name: Update Homebrew formula
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN pushes are excluded from workflow triggers by default.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch published PyPI sdist metadata
        id: pypi
        env:
          PACKAGE: metis-kb
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          package = os.environ["PACKAGE"]
          version = os.environ["REF_NAME"].removeprefix("v")
          metadata_url = f"https://pypi.org/pypi/{package}/{version}/json"

          data = None
          last_error = None
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(metadata_url, timeout=10) as response:
                      data = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  last_error = error
                  if error.code != 404:
                      raise
              except urllib.error.URLError as error:
                  last_error = error

              print(f"PyPI metadata not ready yet for {package} {version}; retry {attempt}/30")
              time.sleep(10)

          if data is None:
              raise SystemExit(f"Could not fetch {metadata_url}: {last_error}")

          sdists = [file for file in data["urls"] if file.get("packagetype") == "sdist"]
          if not sdists:
              raise SystemExit(f"No sdist found in {metadata_url}")

          sdist = sdists[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"url={sdist['url']}\n")
              output.write(f"sha256={sdist['digests']['sha256']}\n")
          PY

      - name: Patch Formula/metis-kb.rb
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
          PYPI_URL: ${{ steps.pypi.outputs.url }}
          SHA256: ${{ steps.pypi.outputs.sha256 }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/metis-kb.rb")
          formula = path.read_text(encoding="utf-8")
          replacements = {
              r'url ".*"': f'url "{os.environ["PYPI_URL"]}"',
              r'sha256 ".*"': f'sha256 "{os.environ["SHA256"]}"',
              r'version ".*"': f'version "{os.environ["VERSION"]}"',
          }

          for pattern, replacement in replacements.items():
              formula = re.sub(pattern, replacement, formula, count=1)

          path.write_text(formula, encoding="utf-8")
          PY

      - name: Commit updated formula
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/metis-kb.rb; then
            echo "Formula/metis-kb.rb is already up to date"
            exit 0
          fi
          git add Formula/metis-kb.rb
          git commit -m "chore: update Homebrew formula to ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main
