name: Release

on:
  push:
    tags:
      - "v*"

# OIDC token is used for PyPI trusted publisher (no API token secrets needed).
# Configure a trusted publisher on PyPI:
#   Publisher: GitHub Actions
#   Owner: abyssnlp  |  Repository: metis  |  Workflow: release.yml
permissions:
  contents: write   # create GitHub releases and push formula update
  id-token: write   # PyPI OIDC trusted publisher

jobs:
  # ── 1. Build wheel + sdist ───────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 2. Publish to PyPI (OIDC — no token secrets) ────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/metis-kb
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 3. Create GitHub Release with dist assets ────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "metis ${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  # ── 4. Update Homebrew formula in-repo (abyssnlp/metis acts as the tap) ───
  update-homebrew:
    name: Update Homebrew formula
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT with write access so the push triggers nothing further;
          # GITHUB_TOKEN pushes are excluded from workflow triggers by default.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Compute new version and SHA256
        id: info
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHA256=$(sha256sum "dist/metis_kb-${VERSION}.tar.gz" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Patch Formula/metis-kb.rb
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA256: ${{ steps.info.outputs.sha256 }}
        run: |
          URL="https://files.pythonhosted.org/packages/source/m/metis-kb/metis_kb-${VERSION}.tar.gz"
          sed -i "s|url \".*\"|url \"${URL}\"|"           Formula/metis-kb.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|"  Formula/metis-kb.rb
          sed -i "s|version \".*\"|version \"${VERSION}\"|" Formula/metis-kb.rb

      - name: Commit updated formula
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/metis-kb.rb
          git commit -m "chore: update Homebrew formula to ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main
